panel_name: green
description: >
  Cytoplasm/membrane marker (Green - 488) ONLY panel for ilastik Pixel
  Classification -- this is the "membrane segmentation" for Erika small
  beads' macrophage marker. Independently trained -- has its own
  membrane_segmentation.ilp in this folder (previously this panel reused
  the "red" panel's Red-561-trained classifier applied to a different
  channel; that generalized poorly enough on real data that it got its own
  training instead). No nuclear channel in this dataset at all, so
  instances are split directly from the membrane mask's shape via
  distance-transform watershed
  (cell_tracker.instance_segmentation.cells_from_membrane_mask), not
  nucleus-seeded watershed.
channels:
  membrane:
    name: Green - 488
    wavelength_nm: 488
    index: null
channel_stack_order:
- membrane
ilastik:
  project_filename: membrane_segmentation.ilp
  export_source: Probabilities
  # 3 classes now -- membrane, background, and cell_contact (marking where
  # two touching cells' walls press together). Order here MUST match the
  # order labels are created in the ilastik GUI (ilastik assigns indices
  # 0, 1, 2... in creation order) -- see green/README.md's training
  # checklist.
  pixel_classes:
    membrane: 0
    background: 1
    cell_contact: 2
  membrane_class: membrane
  # Which pixel_classes key is the touching-cell-boundary class. Set to
  # null (or delete this line) to go back to plain 2-class
  # membrane/background with no contact-aware splitting.
  contact_class: cell_contact
segmentation:
  # Gaussian-smooths the raw membrane probability map (spatial axes only)
  # before thresholding/watershed. 0 = off. Raise it (try 0.5, 1, 2) if the
  # QC panel's threshold mask looks speckly/noisy.
  smoothing_sigma: 0
  # Absolute cutoff on the (smoothed) membrane probability map used to
  # build the binary foreground mask that gets split into cells. Must be
  # LESS than 1 -- probabilities are capped at 1.0, so a threshold of
  # exactly 1 (or higher) can never be exceeded and produces a permanently
  # empty mask (0 cells, 0% membrane area) regardless of the image.
  probability_threshold: 0.5
  # Minimum object size (pixels) -- drops final cell regions smaller than
  # this (debris, noise).
  min_cell_size_px: 20
  # No nuclear channel here, so instances are split directly from the
  # membrane mask's shape (distance-transform watershed) instead of
  # nucleus-seeded watershed -- see cells_from_membrane_mask. This is the
  # minimum pixel distance required between two distance-map peaks for them
  # to count as separate cells. Lower it if touching/tightly-packed cells
  # are being merged into one; raise it if single cells are being split
  # into multiple pieces. Tune by eye against the QC panel. This is a
  # purely geometric fallback -- with contact_class trained and working,
  # this should matter a lot less than it did before, since real contact
  # gaps already give touching cells their own distance-transform peaks.
  min_seed_distance_px: 10
  # Cutoff on the (smoothed) cell_contact probability used to decide which
  # pixels get carved out of the foreground mask as a touching-cell
  # boundary (see ilastik.contact_class above). null = falls back to
  # probability_threshold. Set a separate value here if the contact class
  # needs a different confidence bar than membrane does.
  contact_probability_threshold: null
  # Fills any background-classified hole in the membrane mask that's fully
  # enclosed by foreground (scipy's binary_fill_holes) -- fixes ilastik
  # misclassifying interior pixels as background. False = off. MUST stay
  # off if contact_class (below) is in use: the whole point of a contact
  # class is to carve a deliberate gap between two touching cells, and
  # fill_holes would immediately fill that gap back in (it's fully
  # enclosed by foreground on both sides), silently undoing the split.
  fill_holes: false
  # Frame-level exclusion: flag (not drop) any point whose membrane-positive
  # area fraction exceeds this (0-1 scale). null = off -- disabled for the
  # Erika small beads pipeline (the only current consumer of this panel;
  # macrophage coverage naturally varies a lot by design, so a max-area
  # cutoff isn't meaningful here). There's no max_nuclei_per_frame
  # equivalent either way -- no nuclear channel, so no nucleus count to
  # threshold on.
  max_membrane_area_fraction: null
